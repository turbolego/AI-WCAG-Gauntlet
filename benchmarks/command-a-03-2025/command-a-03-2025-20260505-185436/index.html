<!DOCTYPE html>
<html lang='en'>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1.0'>
  <title>Accessible Single-Page App</title>
  <base href='/'>
  <link rel='stylesheet' href='styles.css'>
  <script src='script.js' defer></script>
  <noscript><p>JavaScript is required for full functionality.</p></noscript>
  <style>body { font-family: Arial, sans-serif; }</style>
<script>window.alert=window.confirm=window.prompt=()=>null;</script>
</head>
<body>
  <header role='banner'>
    <nav aria-label='Main navigation'>
      <ul>
        <li><a href='#main'>Skip to main content</a></li>
        <li><a href='#footer'>Skip to footer</a></li>
      </ul>
    </nav>
    <h1>Accessible Web App</h1>
  </header>
  <main id='main'>
    <section>
      <h2>Introduction</h2>
      <p>This is an accessible single-page application.</p>
      <figure>
        <img src='image.jpg' alt='Descriptive image' aria-describedby='figdesc'>
        <figcaption id='figdesc'>Image description.</figcaption>
      </figure>
    </section>
    <section>
      <h2>Form Example</h2>
      <form>
        <label for='name'>Name:</label>
        <input type='text' id='name' name='name' required>
        <datalist id='suggestions'>
          <option value='Option 1'></option>
          <option value='Option 2'></option>
        </datalist>
        <button type='submit'>Submit</button>
      </form>
    </section>
    <section>
      <h2>Media</h2>
      <video controls>
        <source src='video.mp4' type='video/mp4'>
        <track src='captions.vtt' kind='subtitles' srclang='en' label='English'>
        <p>Your browser doesn't support HTML5 video. <a href='video.mp4'>Download</a> the video instead.</p>
      </video>
      <audio controls>
        <source src='audio.mp3' type='audio/mpeg'>
        <p>Your browser doesn't support HTML5 audio. <a href='audio.mp3'>Download</a> the audio instead.</p>
      </audio>
    </section>
  </main>
  <footer id='footer'>
    <p>&copy; 2023 Accessible App</p>
    <address>
      Contact: <a href='mailto:contact@example.com'>contact@example.com</a>
    </address>
  </footer>
  <dialog id='modal'>
    <p>Modal content</p>
    <button onclick='document.getElementById("modal").close()'>Close</button>
  </dialog>
  <template>
    <div>Template content</div>
  </template>
</body>
</html>
