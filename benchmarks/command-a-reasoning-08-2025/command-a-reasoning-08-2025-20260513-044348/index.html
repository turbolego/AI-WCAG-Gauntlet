<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessible Web App</title>
    <link rel="stylesheet" href="styles.css">
<script>window.alert=window.confirm=window.prompt=()=>null;</script>
</head>
<body>
    <header role="banner">
        <h1>Community Hub</h1>
        <nav aria-label="Primary navigation">
            <ul>
                <li><a href="#main" class="nav-link" aria-current="page"><span>Home</span></a></li>
                <li><a href="#articles" class="nav-link"><span>Articles</span></a></li>
                <li><a href="#about" class="nav-link"><span>About</span></a></li>
            </ul>
        </nav>
    </header>

    <main id="main">
        <article>
            <header>
                <h2>Latest News</h2>
            </header>
            <section aria-labelledby="news-heading">
                <h3 id="news-heading">Community Events</h3>
                <p>Next event: <time datetime="2025-06-15">June 15th</time></p>
                <figure>
                    <img src="event.jpg" alt="Community gathering" width="600" height="400">
                    <figcaption>2024 Spring Festival</figcaption>
                </figure>
            </section>
        </article>

        <aside>
            <h2>Resources</h2>
            <ul>
                <li><a href="/guide">Accessibility Guide</a></li>
                <li><a href="/tools">Development Tools</a></li>
            </ul>
        </aside>

        <section id="about">
            <h2>About Us</h2>
            <p>Contact: <address><a href="mailto:contact@example.com">contact@example.com</a></address></p>
            <bdi class="user-comment">مرحبا بالعالم</bdi>
        </section>

        <form action="#" method="post">
            <fieldset>
                <legend>Subscribe</legend>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                <button type="submit">Subscribe</button>
            </fieldset>
        </form>

        <table>
            <caption>Event Schedule</caption>
            <thead>
                <tr>
                    <th scope="col">Date</th>
                    <th scope="col">Activity</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td><time datetime="2025-06-15">June 15</time></td>
                    <td>Workshop</td>
                </tr>
            </tbody>
        </table>
    </main>

    <footer>
        <p>&copy; 2025 Community Hub</p>
    </footer>
</body>
</html>
