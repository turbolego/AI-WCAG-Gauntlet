name: AI-WCAG-Gauntlet (Cloudflare)

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: Number of benchmark iterations to run
        required: true
        default: "20"
      model:
        description: Model to benchmark via Cloudflare
        required: true
        type: choice
        default: "@cf/meta/llama-3-8b-instruct"
        options:
          - "@cf/aisingapore/gemma-sea-lion-v4-27b-it"
          - "@cf/google/gemma-4-26b-a4b-it"
          - "@cf/ibm-granite/granite-4.0-h-micro"
          - "@cf/moonshotai/kimi-k2.5"
          - "@cf/moonshotai/kimi-k2.6"
          - "@cf/nvidia/nemotron-3-120b-a12b"
          - "@cf/openai/gpt-oss-120b"
          - "@cf/openai/gpt-oss-20b"
          - "@cf/qwen/qwen3-30b-a3b-fp8"
          - "@cf/zai-org/glm-4.7-flash"
          - "DeepSeek R1 Distill Qwen 32B"
          - "Deepseek Coder 6.7B Base (AWQ)"
          - "Deepseek Coder 6.7B Instruct (AWQ)"
          - "Deepseek Math 7B Instruct"
          - "Discolm German 7B v1 (AWQ)"
          - "Falcom 7B Instruct"
          - "Gemma 2B Instruct (LoRA)"
          - "Gemma 3 12B Instruct"
          - "Gemma 7B Instruct"
          - "Gemma 7B Instruct (LoRA)"
          - "Hermes 2 Pro Mistral 7B"
          - "Llama 2 13B Chat (AWQ)"
          - "Llama 2 7B Chat (FP16)"
          - "Llama 2 7B Chat (INT8)"
          - "Llama 2 7B Chat (LoRA)"
          - "Llama 3 8B Instruct"
          - "Llama 3 8B Instruct (AWQ)"
          - "Llama 3.1 8B Instruct (AWQ)"
          - "Llama 3.1 8B Instruct (FP8)"
          - "Llama 3.2 11B Vision Instruct"
          - "Llama 3.2 1B Instruct"
          - "Llama 3.2 3B Instruct"
          - "Llama 3.3 70B Instruct (FP8)"
          - "Llama 4 Scout Instruct"
          - "Llama Guard 3 8B"
          - "Mistral 7B Instruct v0.1"
          - "Mistral 7B Instruct v0.1 (AWQ)"
          - "Mistral 7B Instruct v0.2"
          - "Mistral 7B Instruct v0.2 (LoRA)"
          - "Mistral Small 3.1 24B Instruct"
          - "Neural Chat 7B v3.1 (AWQ)"
          - "OpenChat 3.5 0106"
          - "OpenHermes 2.5 Mistral 7B (AWQ)"
          - "Phi-2"
          - "Qwen 1.5 0.5B Chat"
          - "Qwen 1.5 1.8B Chat"
          - "Qwen 1.5 14B Chat (AWQ)"
          - "Qwen 1.5 7B Chat (AWQ)"
          - "Qwen 2.5 Coder 32B Instruct"
          - "Qwen QwQ 32B"
          - "SQLCoder 7B 2"
          - "Starling LM 7B Beta"
          - "TinyLlama 1.1B Chat v1.0"
          - "Una Cybertron 7B v2 (BF16)"
          - "Zephyr 7B Beta (AWQ)"

concurrency:
  group: ai-wcag-gauntlet-cloudflare
  cancel-in-progress: false

jobs:
  a11y-bench-cloudflare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install Node dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"
        run: npm ci

      - name: Build benchmark Docker image
        run: docker build -t wcag-bench .

      - name: Initialize benchmark run folder
        id: init-benchmark
        run: |
          set -euo pipefail

          MODEL="${{ inputs.model }}"

          # Sanitize the model name for filesystem use.
          SAFE_MODEL=$(echo "$MODEL" | sed 's/[^A-Za-z0-9._-]/-/g')

          make_setup_script() {
            local tmp
            tmp=$(mktemp /tmp/setup_XXXXXX.sh)
            {
              printf 'MODEL_NAME=%q\n'     "$SAFE_MODEL"
              printf 'PROVIDER=%q\n'       "cloudflare"
              printf 'PROVIDER_LABEL=%q\n' "Cloudflare"
              printf 'TOOL=%q\n'           "github-actions"
              grep -vE '^#?(MODEL_NAME|PROVIDER|PROVIDER_LABEL|TOOL)=' setup.sh
            } > "$tmp"
            echo "$tmp"
          }

          SETUP_TMP=$(make_setup_script)
          RUN_DIR=$(bash "$SETUP_TMP" | tee /dev/stderr | grep -oP '(?<=Benchmark setup complete: ).*')
          rm -f "$SETUP_TMP"

          if [ -z "$RUN_DIR" ] || [ ! -d "$RUN_DIR" ]; then
            echo "Error: setup.sh did not produce a valid benchmark folder. Aborting."
            exit 1
          fi
          echo "Created benchmark folder: $RUN_DIR"

          METADATA="$RUN_DIR/metadata.json"
          if [ -f "$METADATA" ]; then
            _tmp=$(mktemp)
            jq --arg m "$MODEL" '.model = $m' "$METADATA" > "$_tmp" && mv "$_tmp" "$METADATA"
          fi

          echo "run_dir=$RUN_DIR" >> "$GITHUB_OUTPUT"
          echo "safe_model=$SAFE_MODEL" >> "$GITHUB_OUTPUT"

      - name: Execute benchmark loop and generate dashboard
        env:
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          set -uo pipefail

          ITERATIONS="${{ inputs.iterations }}"
          MODEL="${{ inputs.model }}"
          SAFE_MODEL="${{ steps.init-benchmark.outputs.safe_model }}"
          RUN_DIR="${{ steps.init-benchmark.outputs.run_dir }}"

          if [ "$ITERATIONS" -lt 1 ] || [ "$ITERATIONS" -gt 100 ]; then
            echo "Error: iterations must be between 1 and 100"
            exit 1
          fi

          echo "Benchmark folder: $RUN_DIR"

          FOUND_PASSING_RUN=false

          for i in $(seq 1 "$ITERATIONS"); do
            echo "━━━ Iteration $i/$ITERATIONS — model: $MODEL (folder name: $SAFE_MODEL) ━━━"

            node scripts/generate-page.mjs \
              --model "$MODEL" \
              --provider cloudflare \
              --outputDir "$RUN_DIR" \
              --iteration "$i" \
              --previousDir "$RUN_DIR"

            GENERATION_JSON="$RUN_DIR/generation.json"
            if [ ! -f "$GENERATION_JSON" ]; then
              echo "Error: generation.json missing after model generation."
              exit 1
            fi

            GENERATED_BY_MODEL=$(jq -r '.generatedByModel // false' "$GENERATION_JSON")
            if [ "$GENERATED_BY_MODEL" != "true" ]; then
              GEN_ERROR=$(jq -r '.generationError // "unknown generation error"' "$GENERATION_JSON")
              echo "Error: model did not generate content this iteration: $GEN_ERROR"
              exit 1
            fi

            docker run --rm \
              -v "$GITHUB_WORKSPACE:/workspace" \
              -w /workspace \
              wcag-bench \
              bash test-suite.sh "$RUN_DIR"
            TEST_EXIT=$?
            if [ "$TEST_EXIT" -ne 0 ]; then
              echo "Warning: test-suite.sh failed with exit code $TEST_EXIT. Skipping to next iteration."
              continue
            fi

            RESULTS_JSON="$RUN_DIR/test_results.json"
            if [ ! -f "$RESULTS_JSON" ]; then
              echo "Warning: test_results.json missing (test runner crashed). Skipping to next iteration."
              continue
            fi

            STATUS=$(jq -r '.[-1].status' "$RESULTS_JSON")
            echo "Iteration $i result: $STATUS"

            if [ "$STATUS" = "pass" ]; then
              echo "Stopping early after iteration $i — all tests passed."
              FOUND_PASSING_RUN=true
              break
            fi
          done

          if [ "$FOUND_PASSING_RUN" = false ]; then
            echo "No fully passing run found after $ITERATIONS iterations."
          fi

          bash generate-dashboard.sh

      - name: Commit and push benchmark results
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html benchmarks docs/stats/benchmark_stats.json
          if git diff --cached --quiet; then
            echo "No benchmark changes to commit."
            exit 0
          fi
          git commit -m "chore(ai-wcag-gauntlet): publish benchmark run (${{ inputs.model }}, iterations=${{ inputs.iterations }}, provider=cloudflare)"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              break
            fi
            echo "Push failed (attempt $attempt/3). Rebasing on latest main and retrying..."
            git pull --rebase origin main
          done
          echo "Failed to push benchmark results after 3 attempts."
          exit 1
