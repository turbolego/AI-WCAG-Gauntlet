name: AI-WCAG-Gauntlet (OpenRouter)

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: Number of benchmark iterations to run
        required: true
        default: "20"
      model:
        description: Model to benchmark via OpenRouter
        required: true
        type: choice
        default: anthropic/claude-sonnet-4
        options:
          - anthropic/claude-sonnet-4
          - anthropic/claude-3.5-sonnet
          - google/gemini-2.5-flash
          - google/gemini-2.5-pro
          - meta-llama/llama-4-scout
          - meta-llama/llama-4-maverick
          - deepseek/deepseek-r1
          - qwen/qwen3-235b-a22b
          - mistralai/mistral-medium-3

concurrency:
  group: ai-wcag-gauntlet-openrouter
  cancel-in-progress: false

jobs:
  a11y-bench-openrouter:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install tools
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"
        run: npm ci

      - name: Execute benchmark loop and generate dashboard
        env:
          OPENROUTER_TOKEN: ${{ secrets.OPENROUTER_TOKEN }}
        shell: bash
        run: |
          iterations="${{ inputs.iterations }}"
          if [ "$iterations" -lt 1 ]; then
            echo "iterations must be at least 1" >&2
            exit 1
          fi
          if [ "$iterations" -gt 100 ]; then
            echo "iterations must be 100 or less" >&2
            exit 1
          fi

          model="${{ inputs.model }}"
          previousRunDir=""
          foundPassingRun=0

          try_parse_json() {
            # Try to parse JSON, repair trailing commas if needed
            local json="$1"
            echo "$json" | jq . 2>/dev/null || \
              echo "$json" | sed 's/,\s*\([}\]]\)/\1/g' | jq . 2>/dev/null || {
                echo "Failed to parse JSON after repair attempts." >&2
                return 1
              }
          }

          for ((i=1; i<=iterations; i++)); do
            echo "Starting iteration $i/$iterations for model $model"
            runDir=$(./setup.sh --model "$model" --iteration "$i" --previous "$previousRunDir" --provider openrouter --provider-key openrouter --provider-label 'OpenRouter' | tail -n 1)

            # Detect rate-limit / generation failure — discard the run and stop
            generationPath="$runDir/generation.json"
            if [ -f "$generationPath" ]; then
              generationRaw=$(cat "$generationPath")
              if ! generation=$(try_parse_json "$generationRaw"); then
                echo "Model generation output is not valid JSON. Discarding this run."
                rm -rf "$runDir"
                break
              fi
              if ! echo "$generation" | jq -e '.generatedByModel' >/dev/null; then
                echo "Model generation failed at iteration $i (rate limit or API error). Discarding this run."
                rm -rf "$runDir"
                break
              fi
            fi

            ./test-suite.sh "$runDir"

            resultPath="$runDir/test_results.json"
            if [ ! -f "$resultPath" ]; then
              echo "Warning: test_results.json missing (test runner crashed). Skipping to next iteration."
              previousRunDir="$runDir"
              continue
            fi
            result=$(cat "$resultPath")
            if [ "$(echo "$result" | jq -r .status)" = "pass" ]; then
              echo "Stopping early after iteration $i because tests passed."
              foundPassingRun=1
              break
            fi

            previousRunDir="$runDir"
          done

          if [ "$foundPassingRun" -eq 0 ]; then
            echo "No fully passing run found after $iterations iterations."
          fi

          bash ./generate-dashboard.sh

      - name: Commit and push benchmark webpages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html benchmarks docs/stats/benchmark_stats.json
          if git diff --cached --quiet; then
            echo "No benchmark changes to commit."
            exit 0
          fi
          git commit -m "chore(ai-wcag-gauntlet): publish benchmark run (${{ inputs.model }}, iterations=${{ inputs.iterations }}, provider=openrouter)"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              break
            fi
            echo "Push failed (attempt $attempt/3). Rebasing on latest main and retrying..."
            git pull --rebase origin main
          done
          echo "Failed to push benchmark results after 3 attempts."
          exit 1
