name: Update Benchmark Stats

on:
  workflow_run:
    workflows:
      - AI-WCAG-Gauntlet (Alibaba)
      - AI-WCAG-Gauntlet (API)
      - AI-WCAG-Gauntlet (Cloudflare)
      - AI-WCAG-Gauntlet (Cohere)
      - AI-WCAG-Gauntlet (Groq LPU)
      - AI-WCAG-Gauntlet (HF)
      - AI-WCAG-Gauntlet (Mistral)
      - AI-WCAG-Gauntlet (Openrouter)
    types:
      - completed
  push:
    branches:
      - main
    paths:
      - 'benchmarks/**'
      - 'docs/stats/**'
      - '.github/scripts/aggregate_stats.py'
      - 'scripts/aggregate-stats.mjs'
      - 'scripts/benchmark-task.mjs'
      - 'resources/html_tags.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/generate-stats.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install aggregation dependencies
        run: npm ci --ignore-scripts

      # ✅ Install Sass
      - name: Install Sass
        run: npm install -g sass

      # ✅ Compile SCSS → CSS
      - name: Build CSS
        run: sass docs/stats/style.scss docs/stats/style.css

      - name: Aggregate benchmark data
        run: python3 .github/scripts/aggregate_stats.py

      - name: Assemble Pages output
        run: |
          mkdir -p _site

          # HTML
          cp docs/stats/index.html _site/index.html

          # JS + CSS
          cp docs/stats/app.js _site/app.js
          cp docs/stats/style.css _site/style.css

          # JSON
          cp docs/stats/benchmark_stats.json _site/benchmark_stats.json

          # Resources (media files referenced by benchmark pages)
          if [ -d resources ]; then
            cp -r resources _site/
            echo "Copied resources to _site/resources/"
          else
            echo "No resources directory found — skipping"
          fi

          # Benchmarks tree
          if [ -d benchmarks ]; then
            cp -r benchmarks _site/
            echo "Copied benchmarks tree to _site/benchmarks/"
            find _site/benchmarks -name "test_results.json" | wc -l | xargs echo "test_results.json files:"
          else
            echo "No benchmarks directory found — skipping"
          fi

          echo "--- _site contents ---"
          ls -la _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5