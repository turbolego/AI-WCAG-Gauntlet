name: AI-WCAG-Gauntlet (Mistral)

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: Number of benchmark iterations to run
        required: true
        default: "3"
      model:
        description: Mistral model to benchmark (via Mistral API)
        required: true
        type: choice
        default: mistral-large-latest
        options:
          - mistral-large-latest
          - mistral-small-latest
          - codestral-latest
          - ministral-8b-latest
          - mistral-medium-latest

concurrency:
  group: ai-wcag-gauntlet-mistral
  cancel-in-progress: false

jobs:
  a11y-bench-mistral:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install tools
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"
        run: npm ci

      - name: Execute benchmark loop and generate dashboard
        env:
          MISTRAL_TOKEN: ${{ secrets.MISTRAL_TOKEN }}
        shell: pwsh
        run: |
          $iterations = [int]::Parse("${{ inputs.iterations }}")
          if ($iterations -lt 1) {
            throw "iterations must be at least 1"
          }
          if ($iterations -gt 100) {
            throw "iterations must be 100 or less"
          }

          $model = "${{ inputs.model }}"
          $previousRunDir = $null
          $foundPassingRun = $false

          function Try-ParseJson {
            param([string]$json)
            try {
              return $json | ConvertFrom-Json
            } catch {
              # Attempt to repair common issues (e.g., trailing commas)
              $fixed = $json -replace ',\s*([\]}])', '$1'
              try {
                return $fixed | ConvertFrom-Json
              } catch {
                Write-Host "Failed to parse JSON after repair attempts."
                return $null
              }
            }
          }

          for ($i = 1; $i -le $iterations; $i++) {
            Write-Host "Starting iteration $i/$iterations for model $model"
            $runDir = ./setup.ps1 -ModelName $model -Iteration $i -PreviousRunDir $previousRunDir -Provider mistral -ProviderKey mistral -ProviderLabel 'Mistral AI' | Select-Object -Last 1

            # Detect rate-limit / generation failure — discard the run and stop
            $generationPath = Join-Path $runDir "generation.json"
            if (Test-Path $generationPath) {
              $generationRaw = Get-Content $generationPath -Raw
              $generation = Try-ParseJson $generationRaw
              if ($null -eq $generation) {
                Write-Host "Model generation output is not valid JSON. Discarding this run."
                Remove-Item -Recurse -Force $runDir
                continue
              }
              if (-not $generation.generatedByModel) {
                Write-Host "Model generation failed at iteration $i`: $($generation.generationError)"
                Remove-Item -Recurse -Force $runDir
                continue
              }
            }

            ./test-suite.ps1 -TargetDir $runDir -AllowFailures

            $resultPath = Join-Path $runDir "test_results.json"
            if (-not (Test-Path $resultPath)) {
              Write-Host "Warning: test_results.json missing (test runner crashed). Skipping to next iteration."
              $previousRunDir = $runDir
              continue
            }
            $result = Get-Content $resultPath -Raw | ConvertFrom-Json
            if ($result.status -eq "pass") {
              Write-Host "Stopping early after iteration $i because tests passed."
              $foundPassingRun = $true
              break
            }

            $previousRunDir = $runDir
          }

          if (-not $foundPassingRun) {
            Write-Host "No fully passing run found after $iterations iterations."
          }

          ./generate-dashboard.ps1

      - name: Commit and push benchmark webpages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html benchmarks docs/stats/benchmark_stats.json
          if git diff --cached --quiet; then
            echo "No benchmark changes to commit."
            exit 0
          fi
          git commit -m "chore(ai-wcag-gauntlet): publish benchmark run (${{ inputs.model }}, iterations=${{ inputs.iterations }}, provider=mistral)"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              break
            fi
            echo "Push failed (attempt $attempt/3). Rebasing on latest main and retrying..."
            git pull --rebase origin main
          done
          echo "Failed to push benchmark results after 3 attempts."
          exit 1
