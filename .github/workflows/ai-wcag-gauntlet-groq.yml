name: AI-WCAG-Gauntlet (Groq LPU)

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: Number of benchmark iterations to run
        required: true
        default: "20"
      model:
        description: Model to benchmark via Groq LPU
        required: true
        type: choice
        default: meta-llama/llama-4-scout-17b-16e-instruct
        options:
          - meta-llama/llama-4-scout-17b-16e-instruct
          - llama-3.3-70b-versatile
          - llama-3.1-8b-instant
          - qwen/qwen3-32b
          - allam-2-7b
          - openai/gpt-oss-120b
          - openai/gpt-oss-20b
          - openai/gpt-oss-safeguard-20b

concurrency:
  group: ai-wcag-gauntlet-groq
  cancel-in-progress: false

jobs:
  a11y-bench-groq:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install RTK (Token-Optimized CLI)
        run: |
          curl -fsSL https://raw.githubusercontent.com/rtk-ai/rtk/refs/heads/master/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies and matching ChromeDriver
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"
        run: |
          rtk npm ci
          rtk npm install -g pa11y @qualweb/cli

          # Detect the major version of the system Chrome so we can install a
          # matching chromedriver. @axe-core/cli uses whatever chromedriver is
          # first on PATH, so putting a version-matched one there prevents the
          # "ChromeDriver only supports Chrome version N" mismatch.
          CHROME_MAJOR=$(/usr/bin/google-chrome --version 2>/dev/null \
            | grep -oP '\d+' | head -1)
          echo "System Chrome major version: $CHROME_MAJOR"

          # Install chromedriver at the matching major version, then axe CLI.
          # npm installs the chromedriver binary into node_modules/.bin/ and
          # also into the global bin — @axe-core/cli will pick it up from PATH.
          rtk npm install -g "chromedriver@^${CHROME_MAJOR}" @axe-core/cli

          # Confirm the versions match
          echo "ChromeDriver version: $(chromedriver --version)"

      - name: Initialize benchmark run folder
        id: init-benchmark
        run: |
          set -euo pipefail

          MODEL="${{ inputs.model }}"

          # Sanitize the model name for use as a filesystem folder name:
          # replace any character that isn't alphanumeric, dot, underscore, or
          # hyphen with a hyphen — same logic as setup.ps1's safeModelName.
          SAFE_MODEL=$(echo "$MODEL" | sed 's/[^A-Za-z0-9._-]/-/g')

          # setup.sh uses unconditional variable assignments so env-var overrides
          # won't work. Build a patched temp copy at runtime: prepend the correct
          # values and strip all existing MODEL_NAME/PROVIDER/PROVIDER_LABEL/TOOL
          # lines from the original.
          make_setup_script() {
            local tmp
            tmp=$(mktemp /tmp/setup_XXXXXX.sh)
            {
              printf 'MODEL_NAME=%q\n'     "$SAFE_MODEL"
              printf 'PROVIDER=%q\n'       "groq"
              printf 'PROVIDER_LABEL=%q\n' "Groq LPU"
              printf 'TOOL=%q\n'           "github-actions"
              grep -vE '^#?(MODEL_NAME|PROVIDER|PROVIDER_LABEL|TOOL)=' setup.sh
            } > "$tmp"
            echo "$tmp"
          }

          # Always initialize a fresh benchmark folder for this workflow run.
          # Never reuse folders from previous runs.
          SETUP_TMP=$(make_setup_script)
          RUN_DIR=$(bash "$SETUP_TMP" | tee /dev/stderr | grep -oP '(?<=Benchmark setup complete: ).*')
          rm -f "$SETUP_TMP"

          if [ -z "$RUN_DIR" ] || [ ! -d "$RUN_DIR" ]; then
            echo "Error: setup.sh did not produce a valid benchmark folder. Aborting."
            exit 1
          fi
          echo "Created benchmark folder: $RUN_DIR"

          # setup.sh writes SAFE_MODEL as the model name — patch metadata.json
          # back to the original human-readable name so the dashboard shows it correctly.
          METADATA="$RUN_DIR/metadata.json"
          if [ -f "$METADATA" ]; then
            _tmp=$(mktemp)
            jq --arg m "$MODEL" '.model = $m' "$METADATA" > "$_tmp" && mv "$_tmp" "$METADATA"
          fi

          echo "run_dir=$RUN_DIR" >> "$GITHUB_OUTPUT"
          echo "safe_model=$SAFE_MODEL" >> "$GITHUB_OUTPUT"

      - name: Execute benchmark loop and generate dashboard
        env:
          GROQ_TOKEN: ${{ secrets.GROQ_TOKEN }}
          # Point pa11y and qualweb (puppeteer-based) at the system Chrome.
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: |
          # Disable errexit for this loop so a single failed test run
          # (for example axe runtime/browser-dialog errors) does not abort
          # the entire benchmark workflow.
          set +e
          set -uo pipefail

          ITERATIONS="${{ inputs.iterations }}"
          MODEL="${{ inputs.model }}"
          SAFE_MODEL="${{ steps.init-benchmark.outputs.safe_model }}"
          RUN_DIR="${{ steps.init-benchmark.outputs.run_dir }}"

          if [ "$ITERATIONS" -lt 1 ] || [ "$ITERATIONS" -gt 100 ]; then
            echo "Error: iterations must be between 1 and 100"
            exit 1
          fi

          echo "Benchmark folder: $RUN_DIR"

          FOUND_PASSING_RUN=false

          for i in $(seq 1 "$ITERATIONS"); do
            echo "━━━ Iteration $i/$ITERATIONS — model: $MODEL (folder name: $SAFE_MODEL) ━━━"

            # Generate updated page content for this iteration using the model.
            # Use the same run directory as feedback context so each pass can
            # improve based on the latest reports.
            rtk node scripts/generate-page.mjs \
              --model "$MODEL" \
              --provider groq \
              --outputDir "$RUN_DIR" \
              --iteration "$i" \
              --previousDir "$RUN_DIR"

            GENERATION_JSON="$RUN_DIR/generation.json"
            if [ ! -f "$GENERATION_JSON" ]; then
              echo "Error: generation.json missing after model generation."
              exit 1
            fi

            GENERATED_BY_MODEL=$(jq -r '.generatedByModel // false' "$GENERATION_JSON")
            if [ "$GENERATED_BY_MODEL" != "true" ]; then
              GEN_ERROR=$(jq -r '.generationError // "unknown generation error"' "$GENERATION_JSON")
              echo "Error: model did not generate content this iteration: $GEN_ERROR"
              exit 1
            fi

            # Run tests; if the runner fails hard, keep iterating.
            rtk bash test-suite.sh "$RUN_DIR"
            TEST_EXIT=$?
            if [ "$TEST_EXIT" -ne 0 ]; then
              echo "Warning: test-suite.sh failed with exit code $TEST_EXIT. Skipping to next iteration."
              continue
            fi

            RESULTS_JSON="$RUN_DIR/test_results.json"
            if [ ! -f "$RESULTS_JSON" ]; then
              echo "Warning: test_results.json missing (test runner crashed). Skipping to next iteration."
              continue
            fi

            # test_results.json is a JSON array — read status from the last entry
            STATUS=$(jq -r '.[-1].status' "$RESULTS_JSON")
            echo "Iteration $i result: $STATUS"

            if [ "$STATUS" = "pass" ]; then
              echo "Stopping early after iteration $i — all tests passed."
              FOUND_PASSING_RUN=true
              break
            fi
          done

          if [ "$FOUND_PASSING_RUN" = false ]; then
            echo "No fully passing run found after $ITERATIONS iterations."
          fi

          bash ./generate-dashboard.sh

      - name: Commit and push benchmark results
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rtk git add index.html benchmarks docs/stats/benchmark_stats.json
          if rtk git diff --cached --quiet; then
            echo "No benchmark changes to commit."
            exit 0
          fi
          rtk git commit -m "chore(ai-wcag-gauntlet): publish benchmark run (${{ inputs.model }}, iterations=${{ inputs.iterations }}, provider=groq)"
          for attempt in 1 2 3; do
            if rtk git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              break
            fi
            echo "Push failed (attempt $attempt/3). Rebasing on latest main and retrying..."
            rtk git pull --rebase origin main
          done
          echo "Failed to push benchmark results after 3 attempts."
          exit 1

      - name: Report RTK token savings
        if: always()
        run: |
          echo "━━━ RTK Token Savings Report ━━━"
          rtk gain --format json || true