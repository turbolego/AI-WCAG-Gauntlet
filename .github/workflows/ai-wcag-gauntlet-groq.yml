name: AI-WCAG-Gauntlet (Groq LPU)

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: Number of benchmark iterations to run
        required: true
        default: "3"
      model:
        description: Model to benchmark via Groq LPU
        required: true
        type: choice
        default: meta-llama/Llama-4-Scout-17B-16E-Instruct
        options:
          - meta-llama/Llama-4-Scout-17B-16E-Instruct
          - meta-llama/Llama-3.3-70B-Instruct
          - Qwen/Qwen3-32B
          - openai/gpt-oss-120b
          - openai/gpt-oss-20b

concurrency:
  group: ai-wcag-gauntlet-groq
  cancel-in-progress: false

jobs:
  a11y-bench-groq:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install dependencies
        run: |
          # npm ci installs local deps including @qualweb/core and w3c-html-validator.
          # We allow puppeteer to download Chrome here so that @axe-core/cli,
          # pa11y, and qualweb all use the same puppeteer-managed binary whose
          # ChromeDriver version is guaranteed to match.
          npm ci
          npm install -g @axe-core/cli pa11y @qualweb/cli

      - name: Resolve puppeteer Chrome path
        id: chrome
        run: |
          # Find the Chrome binary that puppeteer downloaded during npm ci.
          # node_modules/.bin/puppeteer browsers list-installed would work too,
          # but parsing the cache directory directly is simpler and portable.
          CHROME_BIN=$(node -e "
            const { executablePath } = require('puppeteer');
            console.log(executablePath());
          " 2>/dev/null || true)

          if [ -z "$CHROME_BIN" ] || [ ! -x "$CHROME_BIN" ]; then
            # Fallback: glob the puppeteer cache for any chrome binary
            CHROME_BIN=$(find "$HOME/.cache/puppeteer" -name "chrome" -type f 2>/dev/null | head -1)
          fi

          if [ -z "$CHROME_BIN" ] || [ ! -x "$CHROME_BIN" ]; then
            echo "Error: could not locate puppeteer-managed Chrome binary."
            exit 1
          fi

          echo "Found Chrome: $CHROME_BIN"
          echo "path=$CHROME_BIN" >> "$GITHUB_OUTPUT"

      - name: Execute benchmark loop and generate dashboard
        env:
          GROQ_TOKEN: ${{ secrets.GROQ_TOKEN }}
          # Point axe-core/cli, pa11y, and qualweb at the puppeteer-managed
          # Chrome so the ChromeDriver version always matches.
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.chrome.outputs.path }}
        run: |
          # No -e: test-suite.sh always exits 0 by design; we check STATUS ourselves.
          set -uo pipefail

          ITERATIONS="${{ inputs.iterations }}"
          MODEL="${{ inputs.model }}"

          if [ "$ITERATIONS" -lt 1 ] || [ "$ITERATIONS" -gt 100 ]; then
            echo "Error: iterations must be between 1 and 100"
            exit 1
          fi

          # Sanitize the model name for use as a filesystem folder name:
          # replace any character that isn't alphanumeric, dot, underscore, or
          # hyphen with a hyphen — same logic as setup.ps1's safeModelName.
          SAFE_MODEL=$(echo "$MODEL" | sed 's/[^A-Za-z0-9._-]/-/g')

          # setup.sh uses unconditional variable assignments so env-var overrides
          # won't work. Build a patched temp copy at runtime: prepend the correct
          # values and strip all existing MODEL_NAME/PROVIDER/PROVIDER_LABEL/TOOL
          # lines from the original.
          make_setup_script() {
            local tmp
            tmp=$(mktemp /tmp/setup_XXXXXX.sh)
            {
              printf 'MODEL_NAME=%q\n'     "$SAFE_MODEL"
              printf 'PROVIDER=%q\n'       "groq"
              printf 'PROVIDER_LABEL=%q\n' "Groq LPU"
              printf 'TOOL=%q\n'           "github-actions"
              grep -vE '^#?(MODEL_NAME|PROVIDER|PROVIDER_LABEL|TOOL)=' setup.sh
            } > "$tmp"
            echo "$tmp"
          }

          FOUND_PASSING_RUN=false

          for i in $(seq 1 "$ITERATIONS"); do
            echo "━━━ Iteration $i/$ITERATIONS — model: $MODEL (folder name: $SAFE_MODEL) ━━━"

            SETUP_TMP=$(make_setup_script)
            RUN_DIR=$(bash "$SETUP_TMP" | tee /dev/stderr | grep -oP '(?<=Benchmark setup complete: ).*')
            rm -f "$SETUP_TMP"

            if [ -z "$RUN_DIR" ] || [ ! -d "$RUN_DIR" ]; then
              echo "Error: setup.sh did not produce a valid benchmark folder. Aborting."
              exit 1
            fi
            echo "Benchmark folder: $RUN_DIR"

            # setup.sh wrote SAFE_MODEL as the model name — patch metadata.json
            # back to the original human-readable name so the dashboard shows it correctly.
            METADATA="$RUN_DIR/metadata.json"
            if [ -f "$METADATA" ]; then
              _tmp=$(mktemp)
              jq --arg m "$MODEL" '.model = $m' "$METADATA" > "$_tmp" && mv "$_tmp" "$METADATA"
            fi

            # test-suite.sh always exits 0 — read the STATUS line, not the exit code
            bash test-suite.sh "$RUN_DIR"

            RESULTS_JSON="$RUN_DIR/test_results.json"
            if [ ! -f "$RESULTS_JSON" ]; then
              echo "Warning: test_results.json missing (test runner crashed). Skipping to next iteration."
              continue
            fi

            # test_results.json is a JSON array — read status from the last entry
            STATUS=$(jq -r '.[-1].status' "$RESULTS_JSON")
            echo "Iteration $i result: $STATUS"

            if [ "$STATUS" = "pass" ]; then
              echo "Stopping early after iteration $i — all tests passed."
              FOUND_PASSING_RUN=true
              break
            fi
          done

          if [ "$FOUND_PASSING_RUN" = false ]; then
            echo "No fully passing run found after $ITERATIONS iterations."
          fi

          bash generate-dashboard.sh

      - name: Commit and push benchmark results
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html benchmarks docs/stats/benchmark_stats.json
          if git diff --cached --quiet; then
            echo "No benchmark changes to commit."
            exit 0
          fi
          git commit -m "chore(ai-wcag-gauntlet): publish benchmark run (${{ inputs.model }}, iterations=${{ inputs.iterations }}, provider=groq)"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              break
            fi
            echo "Push failed (attempt $attempt/3). Rebasing on latest main and retrying..."
            git pull --rebase origin main
          done
          echo "Failed to push benchmark results after 3 attempts."
          exit 1
